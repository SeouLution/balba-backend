# SeouLution 정책 기본값 — AI 초안 (2026-11-21)
#
# 이 파일의 숫자는 실측 근거가 없는 초안이다. 값을 바꾸려면 이 파일만 고친다. 서버 시작 때 한 번 읽는다.
# 계산 규칙은 docs/spec/domain/calculations.md, 이 값이 쓰이는 자리는 각 절의 주석에 적었다.

version = "draft-2026-11-21"

# ───────── 홈 (C01) ─────────
[home]
# 이 시각부터 홈이 '내일 준비량 · 발주' 화면으로 바뀐다. 그 전은 '오늘 만들 양' 화면.
tomorrow_start = "20:00"

# ───────── 예측 (C02) ─────────
[forecast]
# 평소 대비 차이(반올림한 정수)의 절댓값이 이 값 이하면 '평소와 비슷'.
similar_max_diff = 1
# 반경(m) 안에서 대상일 영업시간과 겹치는 행사가 하나라도 있으면 곱하는 계수. 행사가 여러 개여도 한 번만 곱한다.
event_radius_meters = 3000
event_factor = 1.20
# 서울 문화행사 중 근처 행사로 쓰는 분류. 분류 이름이 아래 값으로 시작하면 쓴다(축제는 '축제-문화/예술' 등 전부).
# 교육/체험, 전시/미술, 영화, 기타는 상시 프로그램이 많아 뺀다.
event_categories = ["축제", "콘서트"]

# 가게별 예측 모델(C02). 요일·날씨 경향은 그 가게의 판매 기록에서 구하고 가중치도 가게마다 정해진다.
# 요일 경향을 쓰는 최소 학습일 수. 그 요일의 학습일이 이보다 적으면 1.0.
min_weekday_days = 2
# 날씨 구간 경향을 쓰는 최소 학습일 수. 그 구간의 학습일이 이보다 적으면 날씨 보정을 하지 않는다.
min_bucket_days = 5
# 기온 구간 경계(℃). [0, 10, 20, 28]이면 0 미만 / 0~10 / 10~20 / 20~28 / 28 이상의 5구간.
temperature_bands = [0, 10, 20, 28]
# 과거 날짜를 '비 온 날'로 보는 일 강수량(mm).
wet_min_mm = 1.0
# 날씨 경향 값의 허용 범위. 벗어나면 이 값으로 자른다.
index_min = 0.5
index_max = 1.5
# 가중치를 조절하는 최소 학습일 수. 이보다 적으면 조절하지 않고 두 가중치를 1.0으로 둔다.
fit_min_days = 56
# 과거 날씨를 받는 기상청 종관(ASOS) 관측 지점 번호. 108은 서울.
observation_station = "108"


# ───────── 거래처 (C03) ─────────
[supplier]
# 서로 다른 영수증 날짜가 이 수 이상이면 그 요일들을 주문 요일로 추정한다(ESTIMATED). 그 미만은 UNKNOWN.
order_days_min_receipt_dates = 3

# ───────── 재고 부족 안내 (C06) ─────────
[low_stock]
# 재료의 재고가 앞으로 이 영업일 수 동안 쓸 양보다 적으면 알린다.
days = 2

# ───────── 업로드 한도 ─────────
[upload]
sales_file_max_mib = 20
sales_max_rows = 100000
receipt_image_max_mib = 10
receipt_images_total_max_mib = 100

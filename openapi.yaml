openapi: 3.1.0
info:
  title: "SeouLution API"
  version: 0.4.0-draft
  description: |
    Figma `SeouLution 와이어프래임`의 '시연시 보여줄 화면'(node 1:2) 중 '후순위'로 덮인 화면을 제외한 화면에 **꼭 필요한 API만** 정의합니다.
    버튼만 있고 화면이 그려지지 않은 기능(POS 컴퓨터에서 올리기 · 칸 고치기 · 재료 상세 · 재료 직접 추가 · 전체 메뉴 예측 보기 · 지난 발주서 다시 열기 · 배달앱 선택 · 마감할인 등록 방법)과 후순위 기능(붐비는 시간 맞추기 · 앱 등록 확인)은 넣지 않습니다.

    - 날짜 `YYYY-MM-DD`, 시각 `HH:mm`(Asia/Seoul), 금액은 원 단위 정수
    - 엑셀 반영 · 영수증 읽기는 비동기: 접수(202) 후 상태 조회

    ## 공통 규칙
    - **성공 상태 코드**: 201 리소스를 만들고 돌려줌 · 202 비동기 접수(본문은 조회에 쓸 `id`뿐이거나 없음) · 200 그 외 본문 있음 · 204 본문 없음
    - **실패 응답**: 본문은 항상 `{ code }`이고, 문구는 프론트가 `code`로 정합니다.
      `INVALID_REQUEST` 422 · `NOT_FOUND` 404 · `INTERNAL_ERROR` 500
    - **목록**: `{ items }`
    - **다른 리소스 참조**: 응답은 `{ id, name }` 객체(`menu` · `ingredient` · `supplier`), 요청은 `~Id`
    - **수량**: 메뉴 수량은 숫자 + 같은 객체의 `unit`, 재료 수량은 `{ value, unit }`
    - **서버가 만든 문장**: 필드 이름은 `title` · `message` · `text` · `~Text`만 씁니다.
    - **`dryRun=true`**: 저장하지 않고 같은 형식의 계산 결과만 돌려줍니다(200).
servers:
  - url: https://api.seoulution.example/v1
tags:
  - name: 1.0 시작하기
  - name: 엑셀 올리기
  - name: 2.0 홈
  - name: 3.0 발주
  - name: 3.0 재료 · 영수증
  - name: 4.0 할인
paths:
  # ───────────── 1.0 시작하기 ─────────────
  /stores:
    post:
      tags: [1.0 시작하기]
      operationId: createStore
      summary: "1.1 가게 정보 저장"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreCreate" }
      responses:
        "201":
          description: "생성됨"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/push-token:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    put:
      tags: [1.0 시작하기]
      operationId: putPushToken
      summary: "푸시 토큰 등록 (전날 밤 20:00 · 아침 07:30 알림)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/ingredient-candidates:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [1.0 시작하기]
      operationId: listIngredientCandidates
      summary: "1.4 핵심 재료 고르기"
      description: "많이 쓰는 순으로 돌려줍니다. '추천만'은 프론트가 `tags`로 거릅니다."
      responses:
        "200":
          description: "재료 후보"
          content:
            application/json:
              schema:
                type: object
                required: [generationStatus, items]
                properties:
                  generationStatus:
                    type: string
                    description: "AI 레시피 · 재료 후보 생성 상태(GENERATING이면 잠시 후 다시 조회)"
                    enum: [GENERATING, READY]
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IngredientCandidate" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/core-ingredients:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    put:
      tags: [1.0 시작하기]
      operationId: setCoreIngredients
      summary: "1.4 핵심 재료 확정 ('N개로 시작하기')"
      description: "고른 재료는 CORE, 나머지 후보는 LATER(나중에 추가)가 됩니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredientIds]
              properties:
                ingredientIds:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/recipes:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [1.0 시작하기]
      operationId: listRecipes
      summary: "1.6 레시피 초안"
      responses:
        "200":
          description: "메뉴별 레시피"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Recipe" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [1.0 시작하기]
      operationId: saveRecipes
      summary: "1.6 '저장하고 홈으로'"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeBatchSave" }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 엑셀 올리기 (1.2~1.3) ─────────────
  /stores/{storeId}/sales-imports:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [엑셀 올리기]
      operationId: createSalesImport
      summary: "1.2 이 기기에서 엑셀 올리기"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: ".xlsx · .xls · .csv"
      responses:
        "202":
          description: "접수됨"
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, description: "진행 상태 조회에 쓰는 importId" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/sales-imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [엑셀 올리기]
      operationId: getSalesImport
      summary: "1.3 열 확인 (진행 상태 조회)"
      responses:
        "200":
          description: "진행 상태 · 판별 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesImport" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/sales-imports/{importId}/confirm:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [엑셀 올리기]
      operationId: confirmSalesImport
      summary: "1.3 열 확인"
      responses:
        "202": { description: "반영 재개" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 2.0 홈 ─────────────
  /stores/{storeId}/home:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [2.0 홈]
      operationId: getHome
      summary: "2.0-1 온보딩 직후 · 2.2 당일 아침 · 2.7-1 행사 펼친 상태 · 2.9 행사 당일 아침"
      description: "날씨 · 근처 행사 · 예측 상위 3개 · 발주 요약 · 주의할 것을 한 번에 내려줍니다. 전날 밤 화면과 당일 아침 화면 중 무엇을 그릴지는 `view`로 내려주며, 두 화면이 바뀌는 시각 기준은 **미정**입니다."
      responses:
        "200":
          description: "홈"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/forecasts/{date}/menus/{menuId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/Date"
      - $ref: "#/components/parameters/MenuId"
    put:
      tags: [2.0 홈]
      operationId: adjustForecast
      summary: "2.0-1 · 2.7-1 준비량 +/−"
      description: "저장하고 재료 발주량 · 금액을 다시 계산해 돌려줍니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number, minimum: 0, examples: [48] }
      responses:
        "200":
          description: "조정 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastAdjustmentResult" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/production/{date}/menus/{menuId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/Date"
      - $ref: "#/components/parameters/MenuId"
    put:
      tags: [2.0 홈]
      operationId: setProduction
      summary: "2.2 '만듦 +1' · 2.3 '기록하기'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number, minimum: 0, examples: [50] }
      responses:
        "204": { description: "기록됨" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 3.0 발주 ─────────────
  /stores/{storeId}/order-plans/{targetDate}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/TargetDate"
    get:
      tags: [3.0 발주]
      operationId: getOrderPlan
      summary: "2.8 행사 반영 발주 · 3.8 상단 '내일 발주'"
      description: "오늘이 주문 요일인 거래처만 묶어 발주량과 단가를 돌려줍니다. 줄 금액 · 합계는 프론트가 수량 × 단가로 계산합니다. +/−로 바꾼 수량은 '발주서 만들기' 때 함께 보냅니다. 근처 행사로 발주량을 늘렸으면 `events`와 줄별 `eventDiff`로 알려줍니다."
      responses:
        "200":
          description: "발주 제안"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPlan" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/purchase-orders:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [3.0 발주]
      operationId: listPurchaseOrders
      summary: "3.8 지난 발주서"
      responses:
        "200":
          description: "최신순"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PurchaseOrderSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [3.0 발주]
      operationId: createPurchaseOrders
      summary: "2.8 '발주서 만들기'"
      description: "거래처별 발주서와 보낼 문구를 만듭니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseOrderCreate" }
      responses:
        "201":
          description: "거래처별 발주서(3.1 화면)"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PurchaseOrder" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/purchase-orders/{purchaseOrderId}/send-records:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/PurchaseOrderId"
    post:
      tags: [3.0 발주]
      operationId: recordSent
      summary: "3.1 문자 · 카카오톡 · 복사 (보낸 방법 기록)"
      description: "전송은 기기에서 하고 서버는 기록만 합니다. 처음 확인한 받는 번호는 거래처에 저장됩니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { $ref: "#/components/schemas/SendChannel" }
                recipientPhone: { type: string }
      responses:
        "204": { description: "기록됨" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 3.0 재료 · 영수증 ─────────────
  /stores/{storeId}/ingredients:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [3.0 재료 · 영수증]
      operationId: listIngredients
      summary: "3.2 재료 탭"
      parameters:
        - name: status
          in: query
          description: "생략 시 CORE · LATER 전체"
          schema: { type: string, enum: [CORE, LATER] }
      responses:
        "200":
          description: "재료 목록"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngredientList" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/suppliers:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [3.0 재료 · 영수증]
      operationId: listSuppliers
      summary: "3.7 거래처 주문 요일"
      responses:
        "200":
          description: "거래처 목록"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Supplier" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/suppliers/order-days:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    put:
      tags: [3.0 재료 · 영수증]
      operationId: saveOrderDays
      summary: "3.7 '저장'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [supplierId, orderDays]
                    properties:
                      supplierId: { type: string }
                      orderDays:
                        type: array
                        items: { $ref: "#/components/schemas/DayOfWeek" }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/receipt-scans:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [3.0 재료 · 영수증]
      operationId: createReceiptScan
      summary: "1.5 · 3.5 '다 찍었어요' (여러 장 한 번에)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 30
                  items: { type: string, contentMediaType: image/jpeg }
      responses:
        "202":
          description: "접수됨"
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, description: "읽은 결과 조회에 쓰는 scanId" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/receipt-scans/{scanId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ScanId"
    get:
      tags: [3.0 재료 · 영수증]
      operationId: getReceiptScan
      summary: "3.6 거래처별 자동 분류"
      responses:
        "200":
          description: "읽은 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptScan" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/receipt-scans/{scanId}/confirm:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ScanId"
    post:
      tags: [3.0 재료 · 영수증]
      operationId: confirmReceiptScan
      summary: "3.6 '저장'"
      description: "거래처 생성 · 단가 기록 · 입고를 한 번에 처리합니다."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptScanConfirm" }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 4.0 할인 ─────────────
  /stores/{storeId}/discount-recommendations:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [4.0 할인]
      operationId: getDiscountRecommendations
      summary: "4.0 할인 탭 상단 카드 · 4.0-2 할인 추천 목록"
      responses:
        "200":
          description: "할인 추천 · 남을 재고"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountRecommendations" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/discounts:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [4.0 할인]
      operationId: listDiscounts
      summary: "4.0 할인 기록 (오늘 · 이번 주 · 전체)"
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [TODAY, THIS_WEEK, ALL]
            default: TODAY
      responses:
        "200":
          description: "최신순"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountHistory" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [4.0 할인]
      operationId: createDiscount
      summary: "4.1 '문구 만들기' (dryRun=true면 기대 절감만 계산)"
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCreate" }
      responses:
        "200":
          description: "dryRun 계산 결과(저장 안 함)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discount" }
        "201":
          description: "생성됨(4.2 화면)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discount" }
        default: { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: "실패"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema: { type: string, examples: ["st_8f2k1"] }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string }
    MenuId:
      name: menuId
      in: path
      required: true
      schema: { type: string }
    ScanId:
      name: scanId
      in: path
      required: true
      schema: { type: string }
    PurchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema: { type: string }
    Date:
      name: date
      in: path
      required: true
      description: "가게 현지 날짜(예측 · 만든 양의 대상 영업일)"
      schema: { type: string, format: date, examples: ["2026-11-11"] }
    TargetDate:
      name: targetDate
      in: path
      required: true
      description: "재료를 쓰는 영업일(전날 밤 발주의 대상일). 예) 11/10 밤 발주 → `2026-11-11`"
      schema: { type: string, format: date, examples: ["2026-11-11"] }
  schemas:
    # ───────── 공통 ─────────
    ErrorCode:
      type: string
      enum: [INVALID_REQUEST, NOT_FOUND, INTERNAL_ERROR]
    Error:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
    LocalTime:
      type: string
      description: "HH:mm (24시간)"
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["21:00"]
    DayOfWeek:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    Quantity:
      type: object
      required: [value, unit]
      properties:
        value: { type: number, examples: [2] }
        unit:
          {
            type: string,
            description: "표시용 단위 라벨",
            examples: ["판", "줄", "인분", "kg", "봉"],
          }
    MenuRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, examples: ["김밥"] }
    IngredientRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, examples: ["계란"] }
    SupplierRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, examples: ["대한식자재"] }

    # ───────── 기준 정보 ─────────
    PosSystemCode:
      type: string
      enum: [TOSS_POS, OKPOS, BAEMIN_POS, OTHER]
    DeliveryAppCode:
      type: string
      description: "`STORE_NOTICE`는 계산대 · SNS용 매장 안내문(항상 포함)"
      enum: [BAEMIN, COUPANG_EATS, STORE_NOTICE]

    # ───────── 가게 ─────────
    Address:
      type: object
      required: [roadAddress]
      properties:
        roadAddress: { type: string, examples: ["서울 마포구 망원로 00"] }
    DayHours:
      type: object
      required: [day, closed]
      properties:
        day: { $ref: "#/components/schemas/DayOfWeek" }
        closed: { type: boolean, description: "쉬는 날" }
        open: { $ref: "#/components/schemas/LocalTime" }
        close: { $ref: "#/components/schemas/LocalTime" }
    BusinessHours:
      type: array
      description: "프론트엔드에서 요일별 영업시간을 항상 7개(월~일)로 펼쳐서 전달합니다."
      minItems: 7
      maxItems: 7
      items: { $ref: "#/components/schemas/DayHours" }
    StoreCategory:
      type: string
      description: "업종 — 분식 · 한식·백반 · 국밥 · 반찬 · 베이커리 · 기타"
      enum: [BUNSIK, KOREAN_MEAL, GUKBAP, BANCHAN, BAKERY, OTHER]
    Store:
      type: object
      required: [id, name, category, address, businessHours]
      properties:
        id: { type: string }
        name: { type: string, examples: ["행복분식"] }
        category: { $ref: "#/components/schemas/StoreCategory" }
        address: { $ref: "#/components/schemas/Address" }
        businessHours: { $ref: "#/components/schemas/BusinessHours" }
    StoreCreate:
      type: object
      required: [name, category, address, businessHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        category: { $ref: "#/components/schemas/StoreCategory" }
        address: { $ref: "#/components/schemas/Address" }
        businessHours: { $ref: "#/components/schemas/BusinessHours" }
    # ───────── 판매 데이터 ─────────
    ColumnMapping:
      type: object
      description: "엑셀 열 이름(첫 줄) 매핑"
      properties:
        date: { type: string, examples: ["주문일자"] }
        menuName: { type: string, examples: ["상품명"] }
        quantity: { type: string, examples: ["수량"] }
    SalesFileDetection:
      type: object
      description: "1.3 열 확인에 쓰는 판별 결과"
      required: [columnMapping]
      properties:
        menuCount: { type: integer, examples: [24] }
        columnMapping: { $ref: "#/components/schemas/ColumnMapping" }
        preview:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              date: { type: string, format: date, examples: ["2026-11-01"] }
              menuName: { type: string, examples: ["참치김밥"] }
              quantity: { type: number, examples: [2] }
    SalesImport:
      type: object
      required: [id, status]
      # 열 확인 상태에서는 판별 결과를 반드시 제공합니다(null 불가).
      if:
        required: [status]
        properties:
          status: { const: NEEDS_CONFIRMATION }
      then:
        required: [detection]
        properties:
          detection: { $ref: "#/components/schemas/SalesFileDetection" }
      properties:
        id: { type: string }
        status:
          type: string
          description: "RECEIVED → PARSING → NEEDS_CONFIRMATION → APPLYING → COMPLETED"
          enum: [RECEIVED, PARSING, NEEDS_CONFIRMATION, APPLYING, COMPLETED]
        posFormat:
          type: [object, "null"]
          description: "형식을 판별한 뒤부터 채워짐"
          properties:
            posSystem: { $ref: "#/components/schemas/PosSystemCode" }
        detection:
          oneOf:
            - $ref: "#/components/schemas/SalesFileDetection"
            - type: "null"
        period:
          type: [object, "null"]
          description: "파일의 판매 기간. 날짜 열을 읽은 뒤부터 채워짐"
          properties:
            from: { type: string, format: date, examples: ["2026-11-03"] }
            to: { type: string, format: date, examples: ["2026-11-09"] }
        recordCount:
          {
            type: [integer, "null"],
            description: "파일의 판매 기록 수",
            examples: [1642],
          }

    # ───────── 레시피 ─────────
    RecipeItem:
      type: object
      required: [ingredient, quantity]
      properties:
        ingredient: { $ref: "#/components/schemas/IngredientRef" }
        quantity:
          $ref: "#/components/schemas/Quantity"
          description: "메뉴 1단위(1줄·1인분)당 사용량 · 재료 사용 단위"
    Recipe:
      type: object
      required: [menu, unit, items]
      properties:
        menu: { $ref: "#/components/schemas/MenuRef" }
        unit: { type: string, examples: ["줄"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/RecipeItem" }
    RecipeBatchSave:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menuId, items]
            properties:
              menuId: { type: string }
              items:
                type: array
                items:
                  type: object
                  required: [ingredientId, quantity]
                  properties:
                    ingredientId: { type: string }
                    quantity: { type: number, minimum: 0 }

    # ───────── 재료 ─────────
    IngredientStatus:
      type: string
      description: "CORE 핵심(예측·발주 대상) · LATER 나중에 추가"
      enum: [CORE, LATER]
    PurchaseUnit:
      type: object
      required: [label]
      properties:
        label: { type: string, examples: ["판"] }
        contentQuantity:
          type: [number, "null"]
          description: "구매 단위 1개에 든 사용 단위 수량(1판 = 30개). 모르면 null → '단위 확인 필요'"
          examples: [30]
    PriceInfo:
      type: object
      required: [unitPrice]
      properties:
        unitPrice:
          {
            type: [integer, "null"],
            description: "구매 단위 1개당 원. 단가가 없으면 null",
            examples: [8900],
          }
    IngredientCandidate:
      type: object
      description: "1.4에서 고를 재료 후보"
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, examples: ["계란"] }
        tags:
          type: array
          description: "배지 — 추천 · 유통기한 짧음 · 비쌈"
          items:
            { type: string, enum: [RECOMMENDED, SHORT_SHELF_LIFE, EXPENSIVE] }
        usedInMenus:
          type: array
          items: { $ref: "#/components/schemas/MenuRef" }
        usedInMenuCount: { type: integer, examples: [6] }
    IngredientSummary:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string, examples: ["계란"] }
        status: { $ref: "#/components/schemas/IngredientStatus" }
        usageUnit: { type: string, examples: ["개"] }
        purchaseUnit:
          oneOf:
            - $ref: "#/components/schemas/PurchaseUnit"
            - type: "null"
        price:
          oneOf:
            - $ref: "#/components/schemas/PriceInfo"
            - type: "null"
        supplier:
          oneOf:
            - $ref: "#/components/schemas/SupplierRef"
            - type: "null"
    IngredientList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngredientSummary" }
        counts:
          type: object
          description: "탭 표시용 — 핵심 N · 나중에 추가 N"
          properties:
            core: { type: integer, examples: [6] }
            later: { type: integer, examples: [4] }
        notices:
          type: array
          description: "재료 탭 안내(단가 10% 이상 변동 등)"
          items: { $ref: "#/components/schemas/Alert" }

    # ───────── 거래처 ─────────
    Supplier:
      type: object
      required: [id, name, orderDays, orderDaysStatus]
      properties:
        id: { type: string }
        name: { type: string, examples: ["대한식자재"] }
        orderDays:
          type: array
          items: { $ref: "#/components/schemas/DayOfWeek" }
        orderDaysStatus:
          type: string
          description: "ESTIMATED 영수증 날짜로 추정 · CONFIRMED 사장님 확인 · UNKNOWN 영수증이 적어 모름(한 번 물어봄)"
          enum: [ESTIMATED, CONFIRMED, UNKNOWN]
        receiptCount: { type: integer, examples: [3] }
    # ───────── 영수증 ─────────
    ReceiptLine:
      type: object
      properties:
        ingredient:
          type: [object, "null"]
          properties:
            id: { type: [string, "null"] }
            name: { type: string, examples: ["계란"] }
            isNew: { type: boolean }
        quantity:
          description: "구매 단위로 환산한 입고량(→ 계란 2판)"
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
    Receipt:
      type: object
      required: [purchasedOn, lines]
      properties:
        purchasedOn: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }
    ReceiptSupplierGroup:
      type: object
      required: [supplier, receipts]
      properties:
        supplier:
          type: object
          properties:
            id: { type: [string, "null"] }
            name: { type: string, examples: ["망원정육"] }
            isNew: { type: boolean }
        receipts:
          type: array
          items: { $ref: "#/components/schemas/Receipt" }
    ReceiptQuestion:
      type: object
      description: "같은 재료인지 묻는 질문"
      required: [id, rawName, candidate]
      properties:
        id: { type: string }
        rawName: { type: string, examples: ["계란 왕란 30구"] }
        candidate: { $ref: "#/components/schemas/IngredientRef" }
    ReceiptScan:
      type: object
      required: [id, status]
      # 검토 상태에서는 거래처별 인식 결과 배열을 반드시 제공합니다(null 불가).
      if:
        required: [status]
        properties:
          status: { const: NEEDS_REVIEW }
      then:
        required: [groups]
      properties:
        id: { type: string }
        status: { type: string, enum: [PROCESSING, NEEDS_REVIEW, CONFIRMED] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ReceiptSupplierGroup" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/ReceiptQuestion" }
        removedDuplicateTexts:
          type: array
          items: { type: string }
          examples: [["11/8 대한식자재 영수증이 두 번 찍혀서 1장은 뺐어요"]]
    ReceiptScanConfirm:
      type: object
      properties:
        answers:
          type: array
          description: "같은 재료인지 묻는 질문의 답('달라요' / '같아요')"
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: string }
              answer: { type: string, enum: [SAME, DIFFERENT] }
    # ───────── 홈 · 날씨 · 행사 ─────────
    HomeView:
      type: string
      description: "TOMORROW 전날 밤(준비량 · 발주) · TODAY 당일 아침(오늘 미리 만들어둘 양). 두 화면이 바뀌는 시각 기준은 미정"
      enum: [TOMORROW, TODAY]
    WeatherCondition:
      type: string
      enum: [CLEAR, PARTLY_CLOUDY, CLOUDY, RAIN, SNOW, RAIN_SNOW, SHOWER]
    WeatherSummary:
      type: object
      required: [temperatureC, condition, text]
      properties:
        temperatureC: { type: number, examples: [7] }
        condition: { $ref: "#/components/schemas/WeatherCondition" }
        text: { type: string, examples: ["비 · 14시부터"] }
        changeText:
          {
            type: [string, "null"],
            description: "밤사이 바뀌었으면 채워짐(파란 테두리 강조)",
            examples: ["비 13시~ · 1시간↑"],
          }
    EventSummary:
      type: object
      required: [id, name, distanceMeters, startAt, endAt]
      properties:
        id: { type: string }
        name: { type: string, examples: ["망원한강공원 ○○축제"] }
        place: { type: string, examples: ["망원한강공원"] }
        distanceMeters: { type: integer, examples: [650] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        crowdLevel: { type: string, enum: [NORMAL, BUSY, VERY_BUSY] }
        expectedVisitors: { type: [integer, "null"], examples: [20000] }
        peakFrom:
          {
            oneOf:
              [{ $ref: "#/components/schemas/LocalTime" }, { type: "null" }],
          }
        peakTo:
          {
            oneOf:
              [{ $ref: "#/components/schemas/LocalTime" }, { type: "null" }],
          }
        detailUrl: { type: [string, "null"], format: uri }
    HomeBanner:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          description: "FIRST_FORECAST 2.0-1 첫 예측 준비됨(X로 닫은 것은 프론트가 기억) · OVERNIGHT_CHANGE 2.2 밤사이 변경 · EVENT_TODAY 2.9 오늘 행사와 붐비는 시간 · DELIVERY_EXPECTED 2.9 어젯밤 발주 입고 예정"
          enum: [FIRST_FORECAST, OVERNIGHT_CHANGE, EVENT_TODAY, DELIVERY_EXPECTED]
        title: { type: string, examples: ["오늘 근처 축제 · 12:00 ~ 18:00"] }
        message:
          {
            type: [string, "null"],
            examples: ["13~16시가 가장 붐벼요 · 12시 전에 김밥 준비를 끝내두세요"],
          }
    OrderPlanSummary:
      type: object
      required: [supplierCount, estimatedTotal]
      properties:
        supplierCount: { type: integer, examples: [3] }
        estimatedTotal:
          {
            type: [integer, "null"],
            description: "단가를 아는 재료가 없으면 null(금액을 비워 둠). 영수증을 건너뛰어 거래처가 없으면 order 자체가 null",
            examples: [400000],
          }
    Home:
      type: object
      required:
        [storeName, view, targetDate, tiles, banners, forecast, cautions]
      properties:
        storeName: { type: string, examples: ["행복분식"] }
        view: { $ref: "#/components/schemas/HomeView" }
        targetDate: { type: string, format: date, examples: ["2026-11-11"] }
        tiles:
          type: object
          properties:
            weather: { $ref: "#/components/schemas/WeatherSummary" }
            events:
              type: array
              description: "반경 3km 행사(2.7-1 아코디언). 0건이면 행사 줄 자체를 숨깁니다"
              items: { $ref: "#/components/schemas/EventSummary" }
        banners:
          type: array
          items: { $ref: "#/components/schemas/HomeBanner" }
        forecast:
          type: object
          required: [items, totalMenuCount]
          properties:
            items:
              type: array
              description: "홈에는 상위 3개 메뉴만(스크롤 없이 한 화면)"
              items: { $ref: "#/components/schemas/ForecastItem" }
            totalMenuCount: { type: integer, examples: [12] }
        order:
          description: "TOMORROW 뷰에서만. 오늘 주문할 거래처가 없으면 null"
          oneOf:
            - $ref: "#/components/schemas/OrderPlanSummary"
            - type: "null"
        cautions:
          type: array
          description: "주의할 것"
          items: { $ref: "#/components/schemas/Alert" }

    # ───────── 예측 ─────────
    ForecastItem:
      type: object
      required: [menu, unit, recommended, planned]
      properties:
        menu: { $ref: "#/components/schemas/MenuRef" }
        unit: { type: string, examples: ["줄"] }
        recommended:
          { type: number, description: "추천 준비량", examples: [50] }
        planned:
          {
            type: number,
            description: "최종 준비량(사장님이 고쳤으면 그 값)",
            examples: [50],
          }
        comparison:
          type: object
          description: "평소(지난 4주 같은 요일 평균) 대비"
          properties:
            direction: { type: string, enum: [MORE, LESS, SIMILAR] }
            diff: { type: number, examples: [-8] }
        summaryText:
          {
            type: string,
            description: "한 줄 근거",
            examples: ["지난 4주 토요일 평균 58줄 · 행사 +20%"],
          }
        eventDiff:
          {
            type: number,
            default: 0,
            description: "근처 행사 때문에 더한 양(2.9 '행사 +12'). 0이면 배지 없음",
            examples: [12],
          }
        previousRecommended:
          {
            type: [number, "null"],
            description: "TODAY 뷰에서 전날 밤 추천량과 달라졌으면 그 이전 값",
            examples: [50],
          }
        produced:
          { type: [number, "null"], description: "TODAY 뷰 — 지금까지 만든 양" }
    ForecastAdjustmentResult:
      type: object
      required: [item]
      properties:
        item: { $ref: "#/components/schemas/ForecastItem" }
        order:
          description: "다시 계산한 발주 요약(홈 발주 카드). 오늘 주문할 거래처가 없으면 null"
          oneOf:
            - $ref: "#/components/schemas/OrderPlanSummary"
            - type: "null"
    # ───────── 발주 ─────────
    OrderLine:
      type: object
      description: "줄 금액 = quantity.value × price.unitPrice. 단가가 없으면 '—'"
      required: [ingredient, quantity, price]
      properties:
        ingredient: { $ref: "#/components/schemas/IngredientRef" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        price: { $ref: "#/components/schemas/PriceInfo" }
        eventDiff:
          {
            type: number,
            default: 0,
            description: "근처 행사 때문에 더한 양, quantity와 같은 단위(2.8 '행사 +1판'). 행사가 있는데 0이면 '평소와 같음'",
            examples: [1],
          }
        stock:
          description: "지금 남은 재고 추정(2.8 '남은 약 1판 반'). value가 0이면 '남은 없음', 모르면 null"
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
    OrderPlanSupplier:
      type: object
      required: [supplier, lines]
      properties:
        supplier: { $ref: "#/components/schemas/SupplierRef" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
    OrderPlan:
      type: object
      required: [targetDate, suppliers]
      properties:
        targetDate: { type: string, format: date, examples: ["2026-11-11"] }
        events:
          type: array
          description: "발주량에 반영한 근처 행사(2.8 · 3.8 행사 안내). 없으면 빈 배열"
          items: { $ref: "#/components/schemas/EventSummary" }
        usualTotal:
          {
            type: [integer, "null"],
            description: "평소 같은 요일 발주 금액. '평소 토요일보다 약 64,000원 많아요'는 프론트가 합계와의 차이로 계산",
            examples: [388000],
          }
        suppliers:
          type: array
          items: { $ref: "#/components/schemas/OrderPlanSupplier" }
    PurchaseOrderCreate:
      type: object
      required: [targetDate, suppliers]
      properties:
        targetDate: { type: string, format: date }
        suppliers:
          type: array
          minItems: 1
          items:
            type: object
            required: [supplierId, lines]
            properties:
              supplierId: { type: string }
              lines:
                type: array
                description: "2.8에서 +/−로 고친 최종 수량"
                items:
                  type: object
                  required: [ingredientId, quantity]
                  properties:
                    ingredientId: { type: string }
                    quantity: { type: number, minimum: 0 }
    SendChannel:
      type: string
      enum: [SMS, KAKAOTALK, COPY]
    PurchaseOrder:
      type: object
      required: [id, targetDate, supplier, messageText]
      properties:
        id: { type: string }
        targetDate: { type: string, format: date }
        supplier:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: [string, "null"] }
            phoneConfirmed: { type: boolean }
            phoneSourceText:
              {
                type: [string, "null"],
                examples: ["11/8 영수증에서 읽었어요. 다음부터는 묻지 않아요"],
              }
        messageText:
          type: string
          examples:
            [
              "[행복분식] 11/11(수) 발주\n계란 특란 30구 × 2판\n김밥김 100매 × 1속\n단무지 1봉\n내일 오전 10시 전 도착 부탁드립니다.",
            ]
    PurchaseOrderSummary:
      type: object
      required: [id, targetDate, supplier]
      properties:
        id: { type: string }
        targetDate: { type: string, format: date }
        supplier: { $ref: "#/components/schemas/SupplierRef" }
        totalAmount: { type: [integer, "null"], examples: [35200] }
    # ───────── 할인 ─────────
    DiscountValue:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [PERCENT, AMOUNT] }
        value:
          {
            type: number,
            description: "PERCENT면 %, AMOUNT면 원",
            examples: [30],
          }
    DiscountRecommendation:
      type: object
      required: [id, menu, discount, startTime, quantity, expectedSavings]
      properties:
        id: { type: string }
        menu: { $ref: "#/components/schemas/MenuRef" }
        unit: { type: string, examples: ["인분"] }
        discount: { $ref: "#/components/schemas/DiscountValue" }
        startTime: { $ref: "#/components/schemas/LocalTime" }
        quantity: { type: number, examples: [5] }
        reasonText: { type: string, examples: ["어묵이 많이 들어가요"] }
        expectedSavings: { type: integer }
    SurplusStockItem:
      type: object
      required: [ingredient, quantity]
      properties:
        ingredient: { $ref: "#/components/schemas/IngredientRef" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        wasteCost: { type: [integer, "null"], examples: [9000] }
        mitigation:
          { type: string, enum: [DISCOUNT_RECOMMENDED, ORDER_REDUCED, NONE] }
    DiscountRecommendations:
      type: object
      required: [date, baseTime, recommendations, surplusStock]
      properties:
        date: { type: string, format: date }
        baseTime: { $ref: "#/components/schemas/LocalTime" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/DiscountRecommendation" }
        surplusStock:
          type: array
          items: { $ref: "#/components/schemas/SurplusStockItem" }
    DiscountCreate:
      type: object
      required: [menuId, discount, startTime, quantity]
      properties:
        recommendationId: { type: string }
        menuId: { type: string }
        discount: { $ref: "#/components/schemas/DiscountValue" }
        startTime: { $ref: "#/components/schemas/LocalTime" }
        quantity: { type: number, minimum: 1 }
    DiscountChannel:
      type: object
      required: [app]
      properties:
        app: { $ref: "#/components/schemas/DeliveryAppCode" }
        launchUrl: { type: [string, "null"] }
        supportsPaste: { type: boolean }
    Discount:
      type: object
      required:
        [
          id,
          date,
          menu,
          discount,
          originalPrice,
          discountedPrice,
          startTime,
          quantity,
          channels,
        ]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        menu: { $ref: "#/components/schemas/MenuRef" }
        unit: { type: string, examples: ["인분"] }
        discount: { $ref: "#/components/schemas/DiscountValue" }
        originalPrice: { type: integer }
        discountedPrice: { type: integer }
        startTime: { $ref: "#/components/schemas/LocalTime" }
        quantity: { type: number }
        wasteCostAvoided:
          {
            type: integer,
            description: "버릴 원가. 기대 절감 = wasteCostAvoided − revenueReduction",
            examples: [9000],
          }
        revenueReduction:
          {
            type: integer,
            description: "할인으로 덜 받는 금액",
            examples: [2500],
          }
        promoText:
          { type: string, examples: ["갓 만든 떡볶이, 마감 전에 할인해요"] }
        channels:
          type: array
          description: "앱 목록과 순서는 서버 고정값입니다"
          items: { $ref: "#/components/schemas/DiscountChannel" }
    DiscountHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: "최신순. 날짜별 묶음은 프론트가 `date`로 만듭니다"
          items: { $ref: "#/components/schemas/Discount" }
    # ───────── 알림 ─────────
    Alert:
      type: object
      required: [id, type, title]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [EXPIRY_IMMINENT, PRICE_CHANGED]
        title:
          { type: string, examples: ["어묵 오늘까지 · 할인 추천이 있어요"] }
        message:
          {
            type: string,
            examples: ["계란 단가가 7,900원 → 8,900원으로 올랐어요 (+13%)"],
          }
        actions:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [OPEN_DISCOUNTS] }

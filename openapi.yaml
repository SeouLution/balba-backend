openapi: 3.1.0
info:
  title: "SeouLution API"
  version: 0.6.0-draft
  description: |
    Figma `SeouLution 와이어프래임`의 '시연시 보여줄 화면'(node 1:2) 중 '후순위'로 덮인 화면을 제외한 화면에 **꼭 필요한 API만** 정의합니다.
    버튼만 있고 화면이 그려지지 않은 기능(POS 컴퓨터에서 올리기 · 칸 고치기 · 재료 상세 · 재료 직접 추가 · 전체 메뉴 예측 보기 · 지난 발주서 다시 열기)과 후순위 기능(붐비는 시간 맞추기 · 앱 등록 확인)은 넣지 않습니다.

    - 날짜 `YYYY-MM-DD`, 시각 `HH:mm`(Asia/Seoul), 금액은 원 단위 정수
    - 엑셀 반영 · 영수증 읽기는 비동기: 접수(202) 후 상태 조회

    ## 공통 규칙
    - **성공 상태 코드**: 201 리소스를 만들고 돌려줌 · 202 비동기 접수(본문은 조회에 쓸 `id`뿐이거나 없음) · 200 그 외 본문 있음 · 204 본문 없음
    - **실패 응답**: 본문은 항상 `{ code }`이고, 문구는 프론트가 `code`로 정합니다.
      `INVALID_REQUEST` 422 · `UNAUTHORIZED` 401 · `NOT_FOUND` 404 · `CONFLICT` 409 · `INTERNAL_ERROR` 500
    - **인증**: 가입 · 로그인 성공 시 HttpOnly 쿠키 `access_token`(JWT, 1일)을 내려줍니다. 가입 · 로그인 · 로그아웃을 뺀 모든 API는 이 쿠키로 사용자를 확인합니다.
      쿠키가 없거나 만료 · 위조되었으면 `UNAUTHORIZED`(401), 경로의 `storeId` · `userId`가 로그인한 사용자 것이 아니면 `NOT_FOUND`(404).
    - **목록**: `{ items }`
    - **다른 리소스 참조**: 응답은 `{ id, name }` 객체(`menu` · `ingredient` · `supplier`), 요청은 `~Id`
    - **수량**: 메뉴 수량은 숫자 + 같은 객체의 `unit`(항상 `인분`), 재료 수량은 `{ value, unit }`(`unit`은 `개` 또는 `g`). 발주 · 재고 · 입고 수량도 판 · 봉 같은 구매 단위가 아니라 재료 단위로 적습니다.
    - **서버가 만든 문장**: 필드 이름은 `title` · `message` · `text` · `~Text`만 씁니다.
servers:
  - url: https://api.seoulution.example/v1
tags:
  - name: 0.0 계정
  - name: 1.0 시작하기
  - name: 엑셀 올리기
  - name: 2.0 홈
  - name: 3.0 발주
  - name: 3.0 재료 · 영수증
paths:
  # ───────────── 0.0 계정 ─────────────
  /auth/signup:
    post:
      tags: [0.0 계정]
      operationId: signUp
      summary: "회원 가입"
      description: "가입하고 로그인 쿠키를 내려줍니다. 가게 id는 아직 없어서 `storeId`는 `null`입니다. 이미 가입된 번호면 `CONFLICT`(409)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: "가입됨. `Set-Cookie: access_token`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [0.0 계정]
      operationId: logIn
      summary: "로그인"
      description: "가게 정보를 저장한 계정이면 `storeId`를, 아니면 `null`을 줍니다. 번호나 비밀번호가 틀리면 `UNAUTHORIZED`(401)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: "로그인됨. `Set-Cookie: access_token`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [0.0 계정]
      operationId: logOut
      summary: "로그아웃"
      description: "로그인 쿠키를 지웁니다."
      responses:
        "204": { description: "로그아웃됨" }
        default: { $ref: "#/components/responses/Error" }
  /users/me:
    get:
      tags: [0.0 계정]
      operationId: getMe
      summary: "내 정보"
      description: "쿠키가 없거나 만료 · 위조되었으면 `UNAUTHORIZED`(401)."
      responses:
        "200":
          description: "로그인한 사용자"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
  /users/{userId}/store:
    get:
      tags: [0.0 계정]
      operationId: getUserStore
      summary: "사용자의 가게 id"
      description: "로그인한 사용자 본인의 가게 id. 가게 정보를 아직 저장하지 않았으면 `storeId`는 `null`. 다른 사용자의 `userId`면 `NOT_FOUND`(404)."
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, examples: ["usr_3b9c0"] }
      responses:
        "200":
          description: "가게 id"
          content:
            application/json:
              schema:
                type: object
                required: [storeId]
                properties:
                  storeId: { type: [string, "null"], examples: ["st_8f2k1"] }
        default: { $ref: "#/components/responses/Error" }
  # ───────────── 1.0 시작하기 ─────────────
  /stores:
    post:
      tags: [1.0 시작하기]
      operationId: createStore
      summary: "1.1 가게 정보 저장"
      description: |
        로그인한 사용자의 가게 정보를 저장하고 이때 가게 id를 발급합니다. 응답의 `id`가 이후 `/users/me`의 `storeId`가 됩니다.
        - 쿠키 `access_token`이 없거나 만료 · 위조되었으면 `UNAUTHORIZED`(401)
        - 이미 가게 정보를 저장한 계정이면 `CONFLICT`(409). 계정당 가게는 하나입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreCreate" }
      responses:
        "201":
          description: "생성됨"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/push-token:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    put:
      tags: [1.0 시작하기]
      operationId: putPushToken
      summary: "푸시 토큰 등록 (전날 밤 20:00 준비량 · 재고 부족 알림, 아침 07:30 알림)"
      description: |
        브라우저 웹 푸시 구독을 가게에 등록합니다. `token`에는 아무 문자열이나 넣을 수 없고, **`PushSubscription` 객체를 `JSON.stringify`한 문자열**을 넣어야 합니다.

        ```js
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: VAPID_PUBLIC_KEY,
        });
        await fetch(`/v1/stores/${storeId}/push-token`, {
          method: "PUT",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: JSON.stringify(subscription) }),
        });
        ```

        `token` 문자열을 JSON으로 읽었을 때 아래를 모두 만족해야 합니다. 하나라도 어기면 `INVALID_REQUEST`(422)입니다.
        - `endpoint`: `https://`로 시작하는 문자열
        - `keys.p256dh`, `keys.auth`: 비어 있지 않은 문자열
        - 전체 길이 4096자 이하

        `"test-push-token-abc123"`처럼 JSON이 아닌 문자열은 422입니다. 실제 구독 없이 시험할 때는 위 형식을 갖춘 가짜 값을 보내면 됩니다.

        가게당 구독은 하나입니다. 다시 등록하면 마지막에 보낸 값으로 바뀌고, 같은 값을 다시 보내도 204입니다. 등록할 때 시험 알림은 보내지 않습니다. 없는 가게면 `NOT_FOUND`(404)입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 4096
                  description: "`PushSubscription`을 `JSON.stringify`한 문자열"
                  examples:
                    - '{"endpoint":"https://fcm.googleapis.com/fcm/send/abc123","expirationTime":null,"keys":{"p256dh":"BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM","auth":"tBHItJI5svbpez7KI4CCXg"}}'
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/recipes:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [1.0 시작하기]
      operationId: listRecipes
      summary: "1.6 레시피 초안"
      description: "메뉴마다 레시피의 모든 재료 항목을 돌려줍니다."
      responses:
        "200":
          description: "메뉴별 레시피"
          content:
            application/json:
              schema:
                type: object
                required: [generationStatus, items]
                properties:
                  generationStatus:
                    type: string
                    description: "AI 레시피 초안 생성 상태(GENERATING이면 items가 비어 있고, 잠시 후 다시 조회)"
                    enum: [GENERATING, READY]
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Recipe" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [1.0 시작하기]
      operationId: saveRecipes
      summary: "1.6 '저장하고 홈으로'"
      description: "요청에 담긴 메뉴마다 레시피 전체를 요청 내용으로 바꿉니다. 요청에 없는 메뉴는 그대로 둡니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeBatchSave" }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 엑셀 올리기 (1.2~1.3) ─────────────
  /stores/{storeId}/sales-imports:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [엑셀 올리기]
      operationId: createSalesImport
      summary: "1.2 이 기기에서 엑셀 올리기"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: ".xlsx · .xls · .csv"
      responses:
        "202":
          description: "접수됨"
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, description: "진행 상태 조회에 쓰는 importId" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/sales-imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [엑셀 올리기]
      operationId: getSalesImport
      summary: "1.3 열 확인 (진행 상태 조회)"
      responses:
        "200":
          description: "진행 상태 · 판별 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesImport" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/sales-imports/{importId}/confirm:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [엑셀 올리기]
      operationId: confirmSalesImport
      summary: "1.3 열 확인"
      description: "찾지 못한 열이 남아 있거나 읽힌 판매 기록이 없으면(`recordCount` 0) 422입니다. 열 바꾸기로 먼저 고칩니다."
      responses:
        "202": { description: "반영 재개" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/sales-imports/{importId}/column-mapping:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ImportId"
    put:
      tags: [엑셀 올리기]
      operationId: updateColumnMapping
      summary: "1.3 열 바꾸기"
      description: "NEEDS_CONFIRMATION 상태에서 날짜·메뉴명·수량 열을 고릅니다. 바꿀 열만 보내고, 보내지 않은 열은 그대로 둡니다. 열 이름은 `detection.columns` 중 하나여야 하며 아니면 422입니다. 파일을 다시 읽어 미리보기·기간·기록 수를 새로 계산한 결과를 돌려줍니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnMapping" }
      responses:
        "200":
          description: "새 매핑으로 다시 읽은 판별 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesImport" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 2.0 홈 ─────────────
  /stores/{storeId}/home:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [2.0 홈]
      operationId: getHome
      summary: "2.0-1 온보딩 직후 · 2.2 당일 아침 · 2.7-1 행사 펼친 상태 · 2.9 행사 당일 아침"
      description: "날씨 · 근처 행사 · 예측 상위 3개 · 발주 요약을 한 번에 내려줍니다. 전날 밤 화면과 당일 아침 화면 중 무엇을 그릴지는 `view`로 내려주며, 한국 시각 00:00부터 20:00 전까지는 TODAY(오늘), 20:00부터 자정 전까지는 TOMORROW(내일)입니다."
      responses:
        "200":
          description: "홈"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/forecasts/{date}/menus/{menuId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/Date"
      - $ref: "#/components/parameters/MenuId"
    put:
      tags: [2.0 홈]
      operationId: adjustForecast
      summary: "2.0-1 · 2.7-1 준비량 +/−"
      description: "저장하고 재료 발주량 · 금액을 다시 계산해 돌려줍니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number, minimum: 0, examples: [48] }
      responses:
        "200":
          description: "조정 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastAdjustmentResult" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/production/{date}/menus/{menuId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/Date"
      - $ref: "#/components/parameters/MenuId"
    put:
      tags: [2.0 홈]
      operationId: setProduction
      summary: "2.2 '만듦 +1' · 2.3 '기록하기'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number, minimum: 0, examples: [50] }
      responses:
        "204": { description: "기록됨" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 3.0 발주 ─────────────
  /stores/{storeId}/order-plans/{targetDate}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/TargetDate"
    get:
      tags: [3.0 발주]
      operationId: getOrderPlan
      summary: "2.8 행사 반영 발주 · 3.8 상단 '내일 발주'"
      description: "오늘이 주문 요일인 거래처만 묶어 발주량과 단가를 돌려줍니다. 영수증 입고가 없어 거래처를 모르는 재료는 supplier=null 묶음으로 마지막에 줍니다. 재고는 오늘 기준이고 음수면 0으로 보고 계산합니다. 줄 금액 · 합계는 프론트가 수량 × 단가로 계산합니다. +/−로 바꾼 수량은 '발주서 만들기' 때 함께 보냅니다. 근처 행사로 발주량을 늘렸으면 `events`와 줄별 `eventDiff`로 알려줍니다."
      responses:
        "200":
          description: "발주 제안"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPlan" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/purchase-orders:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [3.0 발주]
      operationId: listPurchaseOrders
      summary: "3.8 지난 발주서"
      responses:
        "200":
          description: "최신순"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PurchaseOrderSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [3.0 발주]
      operationId: createPurchaseOrders
      summary: "2.8 '발주서 만들기'"
      description: "거래처별 발주서와 보낼 문구를 만듭니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseOrderCreate" }
      responses:
        "201":
          description: "거래처별 발주서(3.1 화면)"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PurchaseOrder" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/purchase-orders/{purchaseOrderId}/send-records:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/PurchaseOrderId"
    post:
      tags: [3.0 발주]
      operationId: recordSent
      summary: "3.1 문자 · 카카오톡 · 복사 (보낸 방법 기록)"
      description: "전송은 기기에서 하고 서버는 기록만 합니다. 처음 확인한 받는 번호는 거래처에 저장됩니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { $ref: "#/components/schemas/SendChannel" }
                recipientPhone: { type: string }
      responses:
        "204": { description: "기록됨" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────── 3.0 재료 · 영수증 ─────────────
  /stores/{storeId}/ingredients:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [3.0 재료 · 영수증]
      operationId: listIngredients
      summary: "3.2 재료 탭"
      responses:
        "200":
          description: "재료 목록"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngredientList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [3.0 재료 · 영수증]
      operationId: createIngredient
      summary: "재료 직접 등록"
      description: "영수증이나 AI 레시피 초안에 없는 재료를 등록합니다. 같은 가게에 같은 이름이 있으면 409입니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientCreate" }
      responses:
        "201":
          description: "등록한 재료"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngredientSummary" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/purchases:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [3.0 재료 · 영수증]
      operationId: createPurchase
      summary: "영수증 없는 재료 수기 입고"
      description: "영수증 입고와 같은 장부에 source=MANUAL로 저장합니다. 수량은 재료 단위(개 또는 g)입니다. isStockReset=true면 이 수량을 그날의 재고로 보고 그 이전 장부를 무시합니다(0 허용). 수기 입고는 재고에만 반영되고 최근 거래처·단가에는 쓰지 않습니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualPurchaseCreate" }
      responses:
        "201":
          description: "저장한 입고"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualPurchase" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/stock:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [3.0 재료 · 영수증]
      operationId: getStock
      summary: "재료별 추정 재고"
      description: "asOf 영업이 끝났을 때 남는 양입니다(입고 − 판매 기록 × 레시피). 입고가 없는 재료는 stock=null, 음수면 warning을 함께 줍니다."
      parameters:
        - name: asOf
          in: query
          required: false
          description: "기준일. 생략하면 오늘. 미래 날짜는 422"
          schema: { type: string, format: date }
      responses:
        "200":
          description: "재료별 재고"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockList" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/suppliers:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [3.0 재료 · 영수증]
      operationId: listSuppliers
      summary: "3.7 거래처 주문 요일"
      responses:
        "200":
          description: "거래처 목록"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Supplier" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/suppliers/order-days:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    put:
      tags: [3.0 재료 · 영수증]
      operationId: saveOrderDays
      summary: "3.7 '저장'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [supplierId, orderDays]
                    properties:
                      supplierId: { type: string }
                      orderDays:
                        type: array
                        items: { $ref: "#/components/schemas/DayOfWeek" }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/receipt-scans:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags: [3.0 재료 · 영수증]
      operationId: createReceiptScan
      summary: "1.5 · 3.5 '다 찍었어요' (여러 장 한 번에)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 30
                  items: { type: string, contentMediaType: image/jpeg }
      responses:
        "202":
          description: "접수됨"
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, description: "읽은 결과 조회에 쓰는 scanId" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/receipt-scans/{scanId}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ScanId"
    get:
      tags: [3.0 재료 · 영수증]
      operationId: getReceiptScan
      summary: "3.6 거래처별 자동 분류"
      responses:
        "200":
          description: "읽은 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptScan" }
        default: { $ref: "#/components/responses/Error" }
  /stores/{storeId}/receipt-scans/{scanId}/confirm:
    parameters:
      - $ref: "#/components/parameters/StoreId"
      - $ref: "#/components/parameters/ScanId"
    post:
      tags: [3.0 재료 · 영수증]
      operationId: confirmReceiptScan
      summary: "3.6 '저장'"
      description: "거래처 생성 · 단가 기록 · 입고를 한 번에 처리합니다."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptScanConfirm" }
      responses:
        "204": { description: "저장됨" }
        default: { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: "실패"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema: { type: string, examples: ["st_8f2k1"] }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string }
    MenuId:
      name: menuId
      in: path
      required: true
      schema: { type: string }
    ScanId:
      name: scanId
      in: path
      required: true
      schema: { type: string }
    PurchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema: { type: string }
    Date:
      name: date
      in: path
      required: true
      description: "가게 현지 날짜(예측 · 만든 양의 대상 영업일)"
      schema: { type: string, format: date, examples: ["2026-11-11"] }
    TargetDate:
      name: targetDate
      in: path
      required: true
      description: "재료를 쓰는 영업일(전날 밤 발주의 대상일). 예) 11/10 밤 발주 → `2026-11-11`"
      schema: { type: string, format: date, examples: ["2026-11-11"] }
  schemas:
    # ───────── 공통 ─────────
    ErrorCode:
      type: string
      enum: [INVALID_REQUEST, UNAUTHORIZED, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
    Error:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
    # ───────── 계정 ─────────
    Credentials:
      type: object
      required: [phoneNumber, password]
      properties:
        phoneNumber: { type: string, description: "아이디. 숫자만", pattern: "^01[0-9]{8,9}$", examples: ["01012345678"] }
        password: { type: string, minLength: 4, maxLength: 128 }
    Me:
      type: object
      required: [userId, storeId, phoneNumber]
      properties:
        userId: { type: string, examples: ["usr_3b9c0"] }
        storeId: { type: [string, "null"], description: "가게 정보를 저장하기 전에는 null", examples: ["st_8f2k1"] }
        phoneNumber: { type: string, examples: ["01012345678"] }
    LocalTime:
      type: string
      description: "HH:mm (24시간)"
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["21:00"]
    DayOfWeek:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    Quantity:
      type: object
      required: [value, unit]
      properties:
        value: { type: number, examples: [60] }
        unit: { $ref: "#/components/schemas/IngredientUnit" }
    IngredientUnit:
      type: string
      description: "재료 단위. 낱개로 세는 재료는 `개`, 그 밖은 `g`(액체는 1ml = 1g)"
      enum: ["개", "g"]
    MenuRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, examples: ["김밥"] }
    IngredientRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, examples: ["계란"] }
    SupplierRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, examples: ["대한식자재"] }

    # ───────── 기준 정보 ─────────
    PosSystemCode:
      type: string
      enum: [TOSS_POS, OKPOS, BAEMIN_POS, OTHER]

    # ───────── 가게 ─────────
    Address:
      type: object
      required: [roadAddress]
      properties:
        roadAddress: { type: string, examples: ["서울 마포구 망원로 00"] }
    DayHours:
      type: object
      required: [day, closed]
      properties:
        day: { $ref: "#/components/schemas/DayOfWeek" }
        closed: { type: boolean, description: "쉬는 날" }
        open: { $ref: "#/components/schemas/LocalTime" }
        close: { $ref: "#/components/schemas/LocalTime" }
    BusinessHours:
      type: array
      description: "월요일부터 일요일까지의 요일별 영업시간 7개."
      minItems: 7
      maxItems: 7
      items: { $ref: "#/components/schemas/DayHours" }
    StoreCategory:
      type: string
      description: "업종 — 분식 · 한식·백반 · 국밥 · 반찬 · 베이커리 · 기타"
      enum: [BUNSIK, KOREAN_MEAL, GUKBAP, BANCHAN, BAKERY, OTHER]
    Store:
      type: object
      required: [id, name, category, address, businessHours]
      properties:
        id: { type: string }
        name: { type: string, examples: ["행복분식"] }
        category: { $ref: "#/components/schemas/StoreCategory" }
        address: { $ref: "#/components/schemas/Address" }
        businessHours: { $ref: "#/components/schemas/BusinessHours" }
    StoreCreate:
      type: object
      required: [name, category, address, businessHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        category: { $ref: "#/components/schemas/StoreCategory" }
        address: { $ref: "#/components/schemas/Address" }
        businessHours: { $ref: "#/components/schemas/BusinessHours" }
    # ───────── 판매 데이터 ─────────
    ColumnMapping:
      type: object
      description: "엑셀 열 이름(첫 줄) 매핑. 찾지 못한 열은 null"
      properties:
        date: { type: [string, "null"], examples: ["주문일자"] }
        menuName: { type: [string, "null"], examples: ["상품명"] }
        quantity: { type: [string, "null"], examples: ["수량"] }
    SalesFileDetection:
      type: object
      description: "1.3 열 확인에 쓰는 판별 결과"
      required: [columnMapping]
      properties:
        menuCount: { type: integer, examples: [24] }
        columns:
          type: array
          description: "파일 첫 줄의 열 이름 목록. 열 바꾸기에서 고를 수 있는 값"
          items: { type: string }
          examples: [["주문일자", "상품명", "수량", "결제금액"]]
        columnMapping: { $ref: "#/components/schemas/ColumnMapping" }
        preview:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              date: { type: string, format: date, examples: ["2026-11-01"] }
              menuName: { type: string, examples: ["참치김밥"] }
              quantity: { type: number, examples: [2] }
    SalesImport:
      type: object
      required: [id, status]
      # 열 확인 상태에서는 판별 결과를 반드시 제공합니다(null 불가).
      if:
        required: [status]
        properties:
          status: { const: NEEDS_CONFIRMATION }
      then:
        required: [detection]
        properties:
          detection: { $ref: "#/components/schemas/SalesFileDetection" }
      properties:
        id: { type: string }
        status:
          type: string
          description: "RECEIVED → PARSING → NEEDS_CONFIRMATION → APPLYING → COMPLETED"
          enum: [RECEIVED, PARSING, NEEDS_CONFIRMATION, APPLYING, COMPLETED]
        posFormat:
          type: [object, "null"]
          description: "형식을 판별한 뒤부터 채워짐"
          properties:
            posSystem: { $ref: "#/components/schemas/PosSystemCode" }
        detection:
          oneOf:
            - $ref: "#/components/schemas/SalesFileDetection"
            - type: "null"
        period:
          type: [object, "null"]
          description: "파일의 판매 기간. 날짜 열을 읽은 뒤부터 채워짐"
          properties:
            from: { type: string, format: date, examples: ["2026-11-03"] }
            to: { type: string, format: date, examples: ["2026-11-09"] }
        recordCount:
          {
            type: [integer, "null"],
            description: "파일의 판매 기록 수",
            examples: [1642],
          }

    # ───────── 레시피 ─────────
    RecipeItem:
      type: object
      required: [ingredient, quantity]
      properties:
        ingredient: { $ref: "#/components/schemas/IngredientRef" }
        quantity:
          $ref: "#/components/schemas/Quantity"
          description: "메뉴 1인분당 사용량 · 재료 단위"
    Recipe:
      type: object
      required: [menu, unit, items]
      properties:
        menu: { $ref: "#/components/schemas/MenuRef" }
        unit: { type: string, description: "항상 `인분`", examples: ["인분"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/RecipeItem" }
    RecipeBatchSave:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menuId, items]
            properties:
              menuId: { type: string }
              items:
                type: array
                items:
                  type: object
                  required: [ingredientId, quantity]
                  properties:
                    ingredientId: { type: string }
                    quantity: { type: number, minimum: 0 }

    # ───────── 재료 ─────────
    PriceInfo:
      type: object
      required: [unitPrice]
      properties:
        unitPrice:
          {
            type: [number, "null"],
            description: "재료 단위 1개(1개 또는 1g)당 원. 소수일 수 있음. 단가가 없으면 null",
            examples: [296.666667],
          }
    IngredientSummary:
      type: object
      required: [id, name, unit]
      properties:
        id: { type: string }
        name: { type: string, examples: ["계란"] }
        unit: { $ref: "#/components/schemas/IngredientUnit" }
        price:
          oneOf:
            - $ref: "#/components/schemas/PriceInfo"
            - type: "null"
        supplier:
          oneOf:
            - $ref: "#/components/schemas/SupplierRef"
            - type: "null"
    IngredientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngredientSummary" }
    IngredientCreate:
      type: object
      required: [name, unit]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, examples: ["단무지"] }
        unit: { $ref: "#/components/schemas/IngredientUnit" }
    ManualPurchaseCreate:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId: { type: string }
        purchasedOn: { type: string, format: date, description: "입고일. 생략하면 오늘. 미래 날짜는 422" }
        quantity: { type: number, minimum: 0, description: "재료 단위 수량. isStockReset=false면 0보다 커야 합니다", examples: [3000] }
        isStockReset: { type: boolean, default: false, description: "현재 재고로 설정" }
    ManualPurchase:
      type: object
      required: [id, ingredient, purchasedOn, quantity, source, isStockReset]
      properties:
        id: { type: integer }
        ingredient: { $ref: "#/components/schemas/IngredientRef" }
        purchasedOn: { type: string, format: date }
        quantity: { $ref: "#/components/schemas/Quantity" }
        source: { type: string, enum: [RECEIPT, MANUAL] }
        isStockReset: { type: boolean }
    StockItem:
      type: object
      required: [ingredient, stock, startedOn, warning]
      properties:
        ingredient: { $ref: "#/components/schemas/IngredientRef" }
        stock:
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
        startedOn: { type: [string, "null"], format: date, description: "장부 시작일(가장 이른 입고일, '현재 재고로 설정'이 있으면 가장 최근 그 날짜)" }
        warning: { type: [string, "null"], examples: ["입고 기록이 누락됐을 수 있어요"] }
    StockList:
      type: object
      required: [asOf, items]
      properties:
        asOf: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/StockItem" }

    # ───────── 거래처 ─────────
    Supplier:
      type: object
      required: [id, name, orderDays, orderDaysStatus]
      properties:
        id: { type: string }
        name: { type: string, examples: ["대한식자재"] }
        orderDays:
          type: array
          items: { $ref: "#/components/schemas/DayOfWeek" }
        orderDaysStatus:
          type: string
          description: "ESTIMATED 영수증 날짜로 추정 · CONFIRMED 사장님 확인 · UNKNOWN 영수증이 적어 모름(한 번 물어봄)"
          enum: [ESTIMATED, CONFIRMED, UNKNOWN]
        receiptCount: { type: integer, examples: [3] }
    # ───────── 영수증 ─────────
    ReceiptLine:
      type: object
      properties:
        ingredient:
          type: [object, "null"]
          properties:
            id: { type: [string, "null"] }
            name: { type: string, examples: ["계란"] }
            isNew: { type: boolean }
        quantity:
          description: "재료 단위로 환산한 입고량(특란 30구 2판 → 60개, 떡볶이떡 2kg 3봉 → 6000g)"
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
    Receipt:
      type: object
      required: [purchasedOn, lines]
      properties:
        purchasedOn: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }
    ReceiptSupplierGroup:
      type: object
      required: [supplier, receipts]
      properties:
        supplier:
          type: object
          properties:
            id: { type: [string, "null"] }
            name: { type: string, examples: ["망원정육"] }
            isNew: { type: boolean }
        receipts:
          type: array
          items: { $ref: "#/components/schemas/Receipt" }
    ReceiptQuestion:
      type: object
      description: "같은 재료인지 묻는 질문"
      required: [id, rawName, candidate]
      properties:
        id: { type: string }
        rawName: { type: string, examples: ["계란 왕란 30구"] }
        candidate: { $ref: "#/components/schemas/IngredientRef" }
    ReceiptScan:
      type: object
      required: [id, status]
      # 검토 상태에서는 거래처별 인식 결과 배열을 반드시 제공합니다(null 불가).
      if:
        required: [status]
        properties:
          status: { const: NEEDS_REVIEW }
      then:
        required: [groups]
      properties:
        id: { type: string }
        status: { type: string, enum: [PROCESSING, NEEDS_REVIEW, CONFIRMED] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ReceiptSupplierGroup" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/ReceiptQuestion" }
        removedDuplicateTexts:
          type: array
          items: { type: string }
          examples: [["11/8 대한식자재 영수증이 두 번 찍혀서 1장은 뺐어요"]]
    ReceiptScanConfirm:
      type: object
      properties:
        answers:
          type: array
          description: "같은 재료인지 묻는 질문의 답('달라요' / '같아요')"
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: string }
              answer: { type: string, enum: [SAME, DIFFERENT] }
    # ───────── 홈 · 날씨 · 행사 ─────────
    HomeView:
      type: string
      description: "TOMORROW 전날 밤(준비량 · 발주) · TODAY 당일 아침(오늘 미리 만들어둘 양). Asia/Seoul 기준 20:00에 TOMORROW, 자정에 TODAY로 전환"
      enum: [TOMORROW, TODAY]
    WeatherCondition:
      type: string
      enum: [CLEAR, PARTLY_CLOUDY, CLOUDY, RAIN, SNOW, RAIN_SNOW, SHOWER]
    WeatherSummary:
      type: object
      required: [temperatureC, condition, text]
      properties:
        temperatureC: { type: number, examples: [7] }
        condition: { $ref: "#/components/schemas/WeatherCondition" }
        text: { type: string, examples: ["비 · 14시부터"] }
        changeText:
          {
            type: [string, "null"],
            description: "밤사이 바뀌었으면 채워짐(파란 테두리 강조)",
            examples: ["비 13시~ · 1시간↑"],
          }
    EventSummary:
      type: object
      required: [id, name, distanceMeters, startAt, endAt]
      properties:
        id: { type: string }
        name: { type: string, examples: ["망원한강공원 ○○축제"] }
        place: { type: string, examples: ["망원한강공원"] }
        distanceMeters: { type: integer, examples: [650] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        crowdLevel: { type: string, enum: [NORMAL, BUSY, VERY_BUSY] }
        expectedVisitors: { type: [integer, "null"], examples: [20000] }
        peakFrom:
          {
            oneOf:
              [{ $ref: "#/components/schemas/LocalTime" }, { type: "null" }],
          }
        peakTo:
          {
            oneOf:
              [{ $ref: "#/components/schemas/LocalTime" }, { type: "null" }],
          }
        detailUrl: { type: [string, "null"], format: uri }
    HomeBanner:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          description: "FIRST_FORECAST 2.0-1 첫 예측 준비됨(X로 닫은 것은 프론트가 기억) · OVERNIGHT_CHANGE 2.2 밤사이 변경 · EVENT_TODAY 2.9 오늘 행사와 붐비는 시간 · DELIVERY_EXPECTED 2.9 어젯밤 발주 입고 예정 · LOW_STOCK 재료의 남은 재고가 앞으로 쓸 양보다 적음(title에 재료 이름, message에 발주 또는 영수증 올리기 안내)"
          enum: [FIRST_FORECAST, OVERNIGHT_CHANGE, EVENT_TODAY, DELIVERY_EXPECTED, LOW_STOCK]
        title: { type: string, examples: ["오늘 근처 축제 · 12:00 ~ 18:00"] }
        message:
          {
            type: [string, "null"],
            examples: ["13~16시가 가장 붐벼요 · 12시 전에 김밥 준비를 끝내두세요"],
          }
    OrderPlanSummary:
      type: object
      required: [supplierCount, estimatedTotal]
      properties:
        supplierCount: { type: integer, examples: [3] }
        estimatedTotal:
          {
            type: [integer, "null"],
            description: "단가를 아는 재료가 없으면 null(금액을 비워 둠). 영수증을 건너뛰어 거래처가 없으면 order 자체가 null",
            examples: [400000],
          }
    Home:
      type: object
      required:
        [storeName, businessHours, view, targetDate, tiles, banners, forecast]
      properties:
        storeName: { type: string, examples: ["행복분식"] }
        businessHours: { $ref: "#/components/schemas/BusinessHours" }
        view: { $ref: "#/components/schemas/HomeView" }
        targetDate: { type: string, format: date, examples: ["2026-11-11"] }
        tiles:
          type: object
          properties:
            weather: { $ref: "#/components/schemas/WeatherSummary" }
            events:
              type: array
              description: "반경 3km 행사(2.7-1 아코디언). 0건이면 행사 줄 자체를 숨깁니다"
              items: { $ref: "#/components/schemas/EventSummary" }
        banners:
          type: array
          items: { $ref: "#/components/schemas/HomeBanner" }
        forecast:
          type: object
          required: [items, totalMenuCount]
          properties:
            items:
              type: array
              description: "홈에는 상위 3개 메뉴만(스크롤 없이 한 화면)"
              items: { $ref: "#/components/schemas/ForecastItem" }
            totalMenuCount: { type: integer, examples: [12] }
        order:
          description: "TOMORROW 뷰에서만. 오늘 주문할 거래처가 없으면 null"
          oneOf:
            - $ref: "#/components/schemas/OrderPlanSummary"
            - type: "null"

    # ───────── 예측 ─────────
    ForecastItem:
      type: object
      required: [menu, unit, recommended, planned]
      properties:
        menu: { $ref: "#/components/schemas/MenuRef" }
        unit: { type: string, description: "항상 `인분`", examples: ["인분"] }
        recommended:
          { type: number, description: "추천 준비량", examples: [50] }
        planned:
          {
            type: number,
            description: "최종 준비량(사장님이 고쳤으면 그 값)",
            examples: [50],
          }
        comparison:
          type: object
          description: "평소(최근 판매 수준에 그 요일의 경향을 반영한 값) 대비"
          properties:
            direction: { type: string, enum: [MORE, LESS, SIMILAR] }
            diff: { type: number, examples: [-8] }
        summaryText:
          {
            type: string,
            description: "한 줄 근거",
            examples: ["평소 토요일 58인분 · 행사 +20%"],
          }
        eventDiff:
          {
            type: number,
            default: 0,
            description: "근처 행사 때문에 더한 양(2.9 '행사 +12'). 0이면 배지 없음",
            examples: [12],
          }
        previousRecommended:
          {
            type: [number, "null"],
            description: "TODAY 뷰에서 전날 밤 추천량과 달라졌으면 그 이전 값",
            examples: [50],
          }
        produced:
          { type: [number, "null"], description: "TODAY 뷰 — 지금까지 만든 양" }
    ForecastAdjustmentResult:
      type: object
      required: [item]
      properties:
        item: { $ref: "#/components/schemas/ForecastItem" }
        order:
          description: "다시 계산한 발주 요약(홈 발주 카드). 오늘 주문할 거래처가 없으면 null"
          oneOf:
            - $ref: "#/components/schemas/OrderPlanSummary"
            - type: "null"
    # ───────── 발주 ─────────
    OrderLine:
      type: object
      description: "줄 금액 = quantity.value × price.unitPrice를 원 단위로 반올림. 단가가 없으면 '—'"
      required: [ingredient, quantity, price]
      properties:
        ingredient: { $ref: "#/components/schemas/IngredientRef" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        price: { $ref: "#/components/schemas/PriceInfo" }
        eventDiff:
          {
            type: number,
            default: 0,
            description: "근처 행사 때문에 더한 양, quantity와 같은 단위(2.8 '행사 +15개'). 행사가 있는데 0이면 '평소와 같음'",
            examples: [15],
          }
        stock:
          description: "지금 남은 재고 추정(2.8 '남은 약 45개'). value가 0이면 '남은 없음', 모르면 null"
          oneOf:
            - $ref: "#/components/schemas/Quantity"
            - type: "null"
    OrderPlanSupplier:
      type: object
      required: [supplier, lines]
      properties:
        supplier:
          description: "null이면 거래처 미정(영수증 입고가 없는 재료). 이 묶음은 발주서를 만들 수 없습니다"
          oneOf:
            - $ref: "#/components/schemas/SupplierRef"
            - type: "null"
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
    OrderPlan:
      type: object
      required: [targetDate, suppliers]
      properties:
        targetDate: { type: string, format: date, examples: ["2026-11-11"] }
        events:
          type: array
          description: "발주량에 반영한 근처 행사(2.8 · 3.8 행사 안내). 없으면 빈 배열"
          items: { $ref: "#/components/schemas/EventSummary" }
        usualTotal:
          {
            type: [integer, "null"],
            description: "평소 같은 요일 발주 금액. '평소 토요일보다 약 64,000원 많아요'는 프론트가 합계와의 차이로 계산",
            examples: [388000],
          }
        suppliers:
          type: array
          items: { $ref: "#/components/schemas/OrderPlanSupplier" }
    PurchaseOrderCreate:
      type: object
      required: [targetDate, suppliers]
      properties:
        targetDate: { type: string, format: date }
        suppliers:
          type: array
          minItems: 1
          items:
            type: object
            required: [supplierId, lines]
            properties:
              supplierId: { type: string }
              lines:
                type: array
                description: "2.8에서 +/−로 고친 최종 수량"
                items:
                  type: object
                  required: [ingredientId, quantity]
                  properties:
                    ingredientId: { type: string }
                    quantity: { type: number, minimum: 0 }
    SendChannel:
      type: string
      enum: [SMS, KAKAOTALK, COPY]
    PurchaseOrder:
      type: object
      required: [id, targetDate, supplier, messageText]
      properties:
        id: { type: string }
        targetDate: { type: string, format: date }
        supplier:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: [string, "null"] }
            phoneConfirmed: { type: boolean }
            phoneSourceText:
              {
                type: [string, "null"],
                examples: ["11/8 영수증에서 읽었어요. 다음부터는 묻지 않아요"],
              }
        messageText:
          type: string
          examples:
            [
              "[행복분식] 11/11(수) 발주\n계란 특란 30구 × 60개\n김밥김 100매 × 100개\n단무지 × 3000g\n내일 오전 10시 전 도착 부탁드립니다.",
            ]
    PurchaseOrderSummary:
      type: object
      required: [id, targetDate, supplier]
      properties:
        id: { type: string }
        targetDate: { type: string, format: date }
        supplier: { $ref: "#/components/schemas/SupplierRef" }
        totalAmount: { type: [integer, "null"], examples: [35200] }

# 실제 앱 이미지가 GHCR에 올라오기 전, 스택과 HTTPS를 검증하기 위한 자리 표시 서비스.
#
#   docker compose --env-file .env.production --env-file .images.env \
#     -f docker-compose.yml -f docker-compose.placeholder.yml up -d
#
# deploy.sh는 이 파일을 쓰지 않으므로, 각 서비스의 첫 실제 배포 때 자동으로 진짜 이미지로 교체된다.

services:
  backend:
    image: caddy:2-alpine
    command: ["caddy", "respond", "--listen", ":8000", "--body", "{\"status\":\"ok\",\"placeholder\":true}"]

  frontend:
    image: caddy:2-alpine
    command: ["caddy", "respond", "--listen", ":80", "--body", "balba placeholder"]
